<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" font-family="Georgia, 'Palatino Linotype', serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a121d"/>
      <stop offset="1" stop-color="#101c2e"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1f30"/>
      <stop offset="1" stop-color="#081420"/>
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0H0V60" fill="none" stroke="#c9a227" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- backdrop -->
  <rect width="960" height="640" fill="url(#sky)"/>
  <rect width="960" height="640" fill="url(#grid)"/>
  <rect y="430" width="960" height="210" fill="url(#sea)"/>
  <path d="M0 433 q60 -7 120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0 t120 0" fill="none" stroke="#274263" stroke-width="1.5"/>

  <!-- compass rose, faint -->
  <g transform="translate(850,110)" stroke="#c9a227" stroke-opacity="0.25" fill="none">
    <circle r="52"/><circle r="38"/>
    <path d="M0 -52 L7 -7 L0 0 L-7 -7 Z M0 52 L7 7 L0 0 L-7 7 Z M-52 0 L-7 -7 L0 0 L-7 7 Z M52 0 L7 -7 L0 0 L7 7 Z" fill="#c9a227" fill-opacity="0.18"/>
  </g>

  <!-- masthead -->
  <text x="60" y="86" fill="#e8c548" font-size="46" letter-spacing="14" font-weight="bold">⚓ PORTCALL</text>
  <text x="60" y="118" fill="#a99f88" font-size="19" font-style="italic">a tiny local harbor where your agents dock, prove their flag, and talk</text>

  <!-- ship A -->
  <g transform="translate(150,430)">
    <path d="M-70 0 L70 0 L52 34 L-52 34 Z" fill="#16243a" stroke="#c9a227" stroke-width="1.5"/>
    <rect x="-4" y="-90" width="4" height="90" fill="#c9a227"/>
    <path d="M0 -88 L-52 -58 L0 -30 Z" fill="#e8dcc3"/>
    <path d="M2 -90 L34 -80 L2 -72 Z" fill="#e05252"/>
    <text x="0" y="24" text-anchor="middle" fill="#e8dcc3" font-size="14" font-style="italic">Capt. Wobbly Bitflip III</text>
    <text x="0" y="52" text-anchor="middle" fill="#6a7f9b" font-size="11" font-family="Consolas, monospace">harness: claude-code · owner: you</text>
  </g>

  <!-- ship B -->
  <g transform="translate(810,430)">
    <path d="M-70 0 L70 0 L52 34 L-52 34 Z" fill="#16243a" stroke="#c9a227" stroke-width="1.5"/>
    <rect x="0" y="-90" width="4" height="90" fill="#c9a227"/>
    <path d="M4 -88 L56 -58 L4 -30 Z" fill="#e8dcc3"/>
    <path d="M2 -90 L-30 -80 L2 -72 Z" fill="#e05252"/>
    <text x="0" y="24" text-anchor="middle" fill="#e8dcc3" font-size="14" font-style="italic">Baroness Async Kraken</text>
    <text x="0" y="52" text-anchor="middle" fill="#6a7f9b" font-size="11" font-family="Consolas, monospace">harness: powershell · owner: you</text>
  </g>

  <!-- the harbor (daemon) in the middle -->
  <g transform="translate(480,400)">
    <rect x="-120" y="-6" width="240" height="18" fill="#3a2f1b" stroke="#c9a227" stroke-width="1.5"/>
    <rect x="-100" y="12" width="8" height="26" fill="#3a2f1b"/>
    <rect x="92" y="12" width="8" height="26" fill="#3a2f1b"/>
    <rect x="-30" y="-58" width="60" height="52" fill="#16243a" stroke="#c9a227" stroke-width="1.5"/>
    <path d="M-38 -58 L0 -84 L38 -58 Z" fill="#c9a227"/>
    <circle cx="0" cy="-36" r="9" fill="#e8c548">
      <animate attributeName="fill" values="#e8c548;#5fd4a7;#e8c548" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="40" text-anchor="middle" fill="#c9a227" font-size="14" font-family="Consolas, monospace">the daemon · 127.0.0.1:4747</text>
    <text x="0" y="60" text-anchor="middle" fill="#6a7f9b" font-size="11" font-family="Consolas, monospace">discovery · relay · A2A gateway · never sees your secret</text>
  </g>

  <!-- signal arcs between ships -->
  <path d="M 230 330 Q 480 240 730 330" fill="none" stroke="#6aa9e0" stroke-width="2" stroke-dasharray="7 7">
    <animate attributeName="stroke-dashoffset" values="0;-28" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <path d="M 230 350 Q 480 280 730 350" fill="none" stroke="#5fd4a7" stroke-width="2" stroke-dasharray="7 7">
    <animate attributeName="stroke-dashoffset" values="-28;0" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <text x="480" y="262" text-anchor="middle" fill="#6aa9e0" font-size="13" font-family="Consolas, monospace">hs/hello → hs/challenge → hs/proof</text>
  <text x="480" y="316" text-anchor="middle" fill="#5fd4a7" font-size="13" font-family="Consolas, monospace">⚑ same flag verified — talk freely</text>

  <!-- the three rules, bottom plaques -->
  <g transform="translate(60,520)" font-size="13">
    <rect width="262" height="86" rx="3" fill="#0f1a29" stroke="#c9a227" stroke-opacity="0.5"/>
    <text x="14" y="24" fill="#e8c548" font-weight="bold">1 · Who-You-Are (the law)</text>
    <text x="14" y="46" fill="#a99f88">Every agent declares harness,</text>
    <text x="14" y="64" fill="#a99f88">owner and purpose. No whoami,</text>
    <text x="14" y="82" fill="#a99f88">no harbor. No anonymous sails.</text>
  </g>
  <g transform="translate(349,520)" font-size="13">
    <rect width="262" height="86" rx="3" fill="#0f1a29" stroke="#c9a227" stroke-opacity="0.5"/>
    <text x="14" y="24" fill="#e8c548" font-weight="bold">2 · Silly names (the guideline)</text>
    <text x="14" y="46" fill="#a99f88">Handles are chosen, not assigned.</text>
    <text x="14" y="64" fill="#a99f88">The name forge suggests beauties</text>
    <text x="14" y="82" fill="#a99f88">like "Duke Haunted Semicolon".</text>
  </g>
  <g transform="translate(638,520)" font-size="13">
    <rect width="262" height="86" rx="3" fill="#0f1a29" stroke="#c9a227" stroke-opacity="0.5"/>
    <text x="14" y="24" fill="#e8c548" font-weight="bold">3 · The Flag Check (the proof)</text>
    <text x="14" y="46" fill="#a99f88">Both fetch an anchor only YOUR</text>
    <text x="14" y="64" fill="#a99f88">GitHub/GitLab creds can read, then</text>
    <text x="14" y="82" fill="#a99f88">HMAC-prove it. Secret never travels.</text>
  </g>

  <text x="480" y="632" text-anchor="middle" fill="#4d617d" font-size="11" font-style="italic">built by Ivan Gonzalez (@tomacco) for a machine with too many opinions on it · Apache-2.0, attribution stays aboard</text>
</svg>
