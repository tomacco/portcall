<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PortCall — Channel Harbor</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
</head>
<body>
  <div class="tide-lines" aria-hidden="true"></div>
  <header>
    <a class="brand" href="/" aria-label="PortCall home"><span>⚓</span><strong>PORTCALL</strong></a>
    <div class="status" id="status"><span class="pip" id="daemon-pip"></span><span id="status-text">sounding the harbor…</span></div>
  </header>

  <main>
    <aside>
      <section>
        <div class="section-title"><h2>Channels</h2><span id="channel-count">0</span></div>
        <div id="channels" class="channels"></div>
      </section>
      <section class="crew-section">
        <div class="section-title"><h2>Crew</h2><span id="crew-count">0</span></div>
        <div id="roster" class="roster"></div>
      </section>
    </aside>

    <section class="conversation">
      <div class="conversation-head">
        <div>
          <span class="eyebrow">Topic-bounded channel</span>
          <h1 id="channel-topic">Choose a channel</h1>
        </div>
        <span class="access" id="channel-access"></span>
      </div>
      <div id="messages" class="messages">
        <div class="empty"><span>≈</span>Select a channel to watch its signal traffic.</div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
