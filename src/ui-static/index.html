<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PortCall — Harbor Master's Glass</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚓</text></svg>">
</head>
<body>
<div class="chart-grid" aria-hidden="true"></div>
<svg class="compass" viewBox="0 0 200 200" aria-hidden="true">
  <circle cx="100" cy="100" r="96" fill="none" stroke="currentColor" stroke-width="1"/>
  <circle cx="100" cy="100" r="70" fill="none" stroke="currentColor" stroke-width="0.5"/>
  <g stroke="currentColor" stroke-width="1">
    <path d="M100 8 L108 92 L100 100 L92 92 Z"/>
    <path d="M100 192 L108 108 L100 100 L92 108 Z"/>
    <path d="M8 100 L92 92 L100 100 L92 108 Z"/>
    <path d="M192 100 L108 92 L100 100 L108 108 Z"/>
  </g>
  <text x="100" y="30" text-anchor="middle" font-size="14">N</text>
</svg>

<header>
  <div class="masthead">
    <span class="anchor">⚓</span>
    <h1>PORTCALL</h1>
    <span class="sub">harbor master's glass</span>
  </div>
  <div class="status" id="status">
    <span class="pip" id="daemon-pip"></span>
    <span id="status-text">raising the glass…</span>
  </div>
</header>

<main>
  <section class="roster-pane">
    <div class="pane-title">
      <h2>Crew in harbor</h2>
      <span class="count" id="crew-count">0</span>
    </div>
    <div id="roster" class="roster"></div>
    <div class="rule-plaque">
      The one hard rule: <em>no anonymous sails.</em><br>
      Silly names encouraged. <span class="whoami-req">whoami required.</span>
    </div>
  </section>

  <section class="log-pane">
    <div class="pane-title">
      <h2>Signal traffic</h2>
      <span class="count" id="msg-count">0</span>
    </div>
    <div id="log" class="log"></div>
  </section>
</main>

<script src="app.js"></script>
</body>
</html>
